# Baut bei jedem Push auf main das Docker-Image und legt es auf ghcr.io ab
# (ghcr.io/frankjuchim/bts-liveticker-v2:latest, für amd64 und arm64).
name: Docker-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit-Zeit
        id: meta
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION_COMMIT=${{ github.sha }}
            VERSION_DATE=${{ steps.meta.outputs.date }}
            VERSION_REPO=${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
