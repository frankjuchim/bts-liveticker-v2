<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alle Spielfelder</title>
<link rel="stylesheet" href="/ticker.css">
<link rel="stylesheet" href="/config.css">
<link rel="icon" href="{{LOGO}}">
<style>
  /* Alle Courts in der Spielfeld-Ansicht, z. B. für einen Bildschirm in der Halle.
     Die Breite eines Felds ergibt sich aus der Fensterbreite und ?cols. */
  body { background: #10151c; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: var(--gap, 12px); padding: var(--gap, 12px); }
  .field-card { container-type: inline-size; border-radius: 12px; }
  .field-head { font-size: clamp(0.7rem, 3.4cqi, 1.6rem); padding: 0.5em 0.8em; }
  .field-foot { font-size: clamp(0.7rem, 3cqi, 1.4rem); padding: 0 0.8em 0.6em; }
  .field { margin: 0.6em; }
  .note { color: #fff; opacity: 0.8; text-align: center; padding: 20vh 16px; font-size: clamp(1rem, 2.5vw, 1.8rem); }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="/live.js"></script>
<script src="/field.js"></script>
<script>
  // /felder?cols=3          Spalten (Standard 2); die Felder teilen sich die Fensterbreite
  //        &c=1,2,5         nur diese Courts (Reihenfolge wie angegeben)
  //        &frei=0          freie Courts ausblenden
  //        &names=full      volle Vornamen
  //        &linger=5        beendetes Spiel noch so viele Minuten zeigen (Standard 5)
  //        &gap=12          Abstand in Pixeln, &bg=<farbe> Hintergrund
  BL.applyCommonParams();
  var p = BL.params;
  var grid = document.getElementById('grid');
  var cols = Math.max(1, Math.min(12, parseInt(p.get('cols'), 10) || 2));
  grid.style.setProperty('--cols', cols);
  var gap = parseInt(p.get('gap'), 10);
  if (gap >= 0) grid.style.setProperty('--gap', gap + 'px');
  var only = (p.get('c') || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  var showFree = p.get('frei') !== '0';
  var linger = parseFloat(p.get('linger'));
  if (!(linger >= 0)) linger = 5;
  var short = p.get('names') !== 'full';
  var last = null;
  var idle = {};   // freie Courts: Element wiederverwenden

  function render(state) {
    last = state;
    var nodes = [];
    if (state && state.btsExtension === false) {
      nodes.push(BL.el('div', 'note', 'Die Spielfeld-Ansicht ist nur verfügbar, wenn BTS die Erweiterung für Aufschläger/Rückschläger hat.'));
    } else {
      var courts = (state && state.courts) || [];
      if (only.length) courts = only.map(function (nr) { return BL.court(state, nr); }).filter(Boolean);
      courts.forEach(function (c) {
        var m = BL.courtMatch(state, c, linger);
        if (m) nodes.push(Field.render(m, { court: c.num, short: short }));
        else if (showFree) nodes.push(idle[c.num] || (idle[c.num] = Field.empty(c.num)));
      });
      if (!nodes.length) nodes.push(BL.el('div', 'note', 'Gerade kein Spiel'));
    }
    if (nodes[0] && nodes[0].className === 'note') grid.style.display = 'block';
    else grid.style.display = '';
    // nur geänderte Felder austauschen (sonst starten die Pfeil-Animationen neu)
    nodes.forEach(function (n, i) {
      var cur = grid.children[i];
      if (cur === n) return;
      if (cur && !n.parentNode) grid.replaceChild(n, cur);
      else grid.insertBefore(n, cur || null);
    });
    while (grid.children.length > nodes.length) grid.removeChild(grid.lastChild);
  }
  BL.connect(render);
  setInterval(function () { if (last) render(last); }, 15000);
</script>
</body>
</html>
