<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Overlay</title>
<link rel="stylesheet" href="/overlay.css">
<link rel="stylesheet" href="/config.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="/live.js"></script>
<script src="/overlay.js"></script>
<script>
  // /court/1, /court/2, … (alternativ ?court=1)
  BL.applyCommonParams();
  var p = BL.params;
  var nr = p.get('court') || decodeURIComponent(location.pathname.split('/').pop()) || '1';
  document.title = 'Court ' + nr + ' – Overlay';
  var opts = Overlay.options(p);
  var stage = document.getElementById('stage');
  var last = null;

  function render(state) {
    last = state;
    stage.replaceChildren();
    var board = Overlay.courtBoard(state, nr, opts);
    if (board.classList.contains('idle') && p.get('showIdle') !== '1') return;
    stage.appendChild(board);
  }
  BL.connect(render);
  // „zuletzt beendet“ läuft nach linger Minuten ab
  setInterval(function () { if (last) render(last); }, 15000);
</script>
</body>
</html>
