<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spieler – Liveticker</title>
<link rel="stylesheet" href="/ticker.css">
<link rel="stylesheet" href="/config.css">
<link rel="icon" href="{{LOGO}}">
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img src="{{LOGO}}" alt="" data-brand-logo>
    <div><b data-brand="title">{{TITLE}}</b><span data-brand="subtitle">{{SUBTITLE}}</span></div>
  </div>
  <header class="event">
    <div class="t-text">
      <h1 id="tName">Spieler</h1>
      <div class="t-meta"><a href="/" class="back">‹ Zum Liveticker</a></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" data-tab="meine">Meine Spieler</button>
    <button type="button" data-tab="spieler">Alle Spieler</button>
    <button type="button" data-tab="vereine">Vereine</button>
    <button type="button" data-tab="statistik">Statistik</button>
  </nav>
  <p class="sched-note pl-sched" id="plSched" hidden></p>

  <section data-panel="profil" hidden>
    <a href="#spieler" class="back pl-back">‹ Alle Spieler</a>
    <div id="profil"></div>
  </section>

  <section data-panel="meine">
    <p class="muted" id="meineHint">Noch niemandem gefolgt. Unter „Alle Spieler“ oder „Vereine“ den Stern antippen – oder im
      Liveticker auf einen Namen tippen.</p>
    <div id="meineList" class="pl-cards"></div>
    <button type="button" class="more" id="notifyBtn" hidden>Benachrichtigungen einschalten</button>
  </section>

  <section data-panel="spieler" hidden>
    <div class="tools"><input type="search" id="pq" placeholder="Name oder Verein suchen …" autocomplete="off"></div>
    <div id="spielerList" class="pl-rows"></div>
  </section>

  <section data-panel="vereine" hidden>
    <p class="muted" id="vereineHint" hidden>Vereine gibt es nur, wenn BTS die Liveticker-Erweiterung (v2) hat.</p>
    <div id="vereineList" class="pl-rows"></div>
  </section>

  <section data-panel="statistik" hidden>
    <div class="day-pick" id="statDays" hidden></div>
    <div class="stat-export" id="statExport">
      <span class="muted">Export:</span>
      <button type="button" data-export="matches">Spiele (CSV)</button>
      <button type="button" data-export="players">Spieler (CSV)</button>
      <button type="button" data-export="clubs">Vereine (CSV)</button>
      <button type="button" data-export="events">Disziplinen (CSV)</button>
      <button type="button" data-export="json">Alles (JSON)</button>
      <button type="button" data-export="print">Drucken / PDF</button>
    </div>
    <div id="statTiles" class="stat-tiles"></div>
    <div id="statTables"></div>
  </section>

  <footer class="foot"><span id="conn" class="conn">Verbinde …</span></footer>
</main>

<script src="/live.js"></script>
<script src="/schedule.js"></script>
<script src="/follow.js"></script>
<script src="/nations.js"></script>
<script>
(function () {
  'use strict';
  BL.applyCommonParams();
  var el = BL.el;
  var last = null;
  var tab = (location.hash || '#meine').slice(1);
  var pq = document.getElementById('pq');
  var sched = null;   // Zeitplan-Schätzung (schedule.js)

  // „ca. 14:45“ (geschätzt) bzw. „14:20“ (angesetzt)
  function when(u) {
    var eta = sched && sched.eta[u.id];
    return eta ? 'ca. ' + Schedule.clock(eta) : u.time;
  }

  // ---- Daten je Spieler aus Spielen und „Als Nächstes“ zusammentragen
  function collect(state) {
    var players = {};
    function rec(name, club) {
      var p = players[name] || (players[name] = { name: name, club: '', items: [], wins: 0, losses: 0 });
      if (club && !p.club) p.club = club;
      return p;
    }
    ((state && state.matches) || []).forEach(function (m) {
      ['home', 'away'].forEach(function (side) {
        (m[side] || []).forEach(function (n, i) {
          if (!n) return;
          var p = rec(n, ((side === 'home' ? m.homeClubs : m.awayClubs) || [])[i]);
          p.items.push({ m: m, side: side });
          if (m.status === 'finished') { if (m.winner === side) p.wins++; else p.losses++; }
        });
      });
    });
    ((state && state.upcoming) || []).forEach(function (u) {
      ['home', 'away'].forEach(function (side) {
        (u[side] || []).forEach(function (n, i) {
          if (!n) return;
          rec(n, ((side === 'home' ? u.homeClubs : u.awayClubs) || [])[i]).items.push({ u: u, side: side });
        });
      });
    });
    return players;
  }

  function other(side) { return side === 'home' ? 'away' : 'home'; }
  function team(x, side) { return ((x.m || x.u)[side] || []).filter(Boolean).join(' / ') || 'N. N.'; }

  // Was macht der Spieler gerade / als Nächstes?
  function status(p) {
    var live = p.items.filter(function (x) { return x.m && (x.m.status === 'live' || x.m.status === 'called'); })[0];
    if (live) {
      var split = BL.splitSets(live.m);
      var sc = split.current ? ' · ' + split.current[live.side] + ':' + split.current[other(live.side)] : '';
      return { cls: 'live', text: (live.m.status === 'live' ? 'Spielt auf Court ' : 'Aufruf Court ') + live.m.court + sc };
    }
    var up = p.items.filter(function (x) { return x.u; })[0];
    if (up) return { cls: up.u.state === 'preparation' ? 'called' : 'next', text: (up.u.state === 'preparation' ? 'Gleich dran' : 'Als Nächstes') + (when(up.u) ? ' · ' + when(up.u) + ' Uhr' : '') +
      (sched && sched.eta[up.u.id] && up.u.time ? ' (Plan ' + up.u.time + ')' : '') };
    return null;
  }

  function starBtn(on, title, fn) {
    var b = el('button', 'star' + (on ? ' on' : ''), on ? '★' : '☆');
    b.type = 'button';
    b.title = title;
    b.addEventListener('click', fn);
    return b;
  }

  // Eine Zeile im Spielverlauf eines Spielers
  function itemRow(x, me) {
    var row = el('div', 'pl-item');
    var tag;
    if (x.u) {
      tag = el('span', 'badge ' + (x.u.state === 'preparation' ? 'called' : 'next'), when(x.u) || 'geplant');
    } else if (x.m.status === 'live' || x.m.status === 'called') {
      tag = el('span', 'badge live', 'Court ' + x.m.court);
    } else if (x.m.status === 'finished') {
      tag = el('span', 'badge ' + (x.m.winner === x.side ? 'won' : 'lost'), x.m.winner === x.side ? 'Sieg' : 'Niederlage');
    } else {
      tag = el('span', 'badge done', 'ohne Ergebnis');
    }
    row.appendChild(tag);
    var mid = el('div', 'pl-mid');
    mid.appendChild(el('div', 'pl-event', (x.m || x.u).name));
    // im Doppel den Partner nennen (ohne den Spieler selbst)
    var partner = ((x.m || x.u)[x.side] || []).filter(function (n) { return n && n !== me; }).join(' / ');
    mid.appendChild(el('div', 'pl-vs', 'gegen ' + team(x, other(x.side)) + (partner ? ' · mit ' + partner : '')));
    row.appendChild(mid);
    if (x.m && x.m.sets.length) {
      var right = el('div', 'pl-score');
      right.appendChild(el('b', null, x.m.sets.map(function (s) { return s[x.side] + ':' + s[other(x.side)]; }).join('  ')));
      var meta = [];
      if (x.m.duration) meta.push(Follow.duration(x.m.duration));
      if (x.m.finishedAt) meta.push(BL.time(x.m.finishedAt) + ' Uhr');
      if (meta.length) right.appendChild(el('span', null, meta.join(' · ')));
      row.appendChild(right);
    }
    return row;
  }

  // Reihenfolge: läuft → gleich/als Nächstes → beendet (neueste zuerst)
  function ordered(items) {
    function k(x) {
      if (x.m && (x.m.status === 'live' || x.m.status === 'called')) return 0;
      if (x.u) return x.u.state === 'preparation' ? 1 : 2;
      return 3;
    }
    return items.slice().sort(function (a, b) {
      if (k(a) !== k(b)) return k(a) - k(b);
      if (a.u && b.u) return ((a.u.date || '') + (a.u.time || '')).localeCompare((b.u.date || '') + (b.u.time || ''));
      return ((b.m && b.m.finishedAt) || '').localeCompare((a.m && a.m.finishedAt) || '');
    });
  }

  // Name als Link zur Spieler-Statistik (#p=Name)
  function profileLink(tag, name) {
    var a = el('a', 'pl-link');
    a.href = '#p=' + encodeURIComponent(name);
    a.title = 'Statistik von ' + name;
    a.appendChild(el(tag, null, name));
    return a;
  }

  function playerCard(p) {
    var card = el('article', 'pl-card');
    var head = el('div', 'pl-head');
    head.appendChild(starBtn(true, 'Nicht mehr folgen', function () { Follow.remove(p.name); }));
    var who = el('div', 'pl-who');
    who.appendChild(profileLink('b', p.name));
    var sub = [];
    if (p.club) sub.push(p.club);
    if (p.wins + p.losses) sub.push(p.wins + (p.wins === 1 ? ' Sieg' : ' Siege') + ' · ' + p.losses + (p.losses === 1 ? ' Niederlage' : ' Niederlagen'));
    if (sub.length) who.appendChild(el('span', 'muted', sub.join(' · ')));
    head.appendChild(who);
    var st = status(p);
    if (st) head.appendChild(el('span', 'pl-status ' + st.cls, st.text));
    card.appendChild(head);
    var items = ordered(p.items);
    if (!items.length) card.appendChild(el('p', 'muted pl-empty', 'Noch keine Spiele gefunden.'));
    items.forEach(function (x) { card.appendChild(itemRow(x, p.name)); });
    return card;
  }

  function renderMeine(players) {
    var list = document.getElementById('meineList');
    list.replaceChildren();
    var names = Follow.list();
    // Spieler gefolgter Vereine kommen dazu
    Object.keys(players).forEach(function (n) {
      if (Follow.hasClub(players[n].club) && names.indexOf(n) < 0) names.push(n);
    });
    document.getElementById('meineHint').hidden = names.length > 0 || Follow.clubs().length > 0;
    names.sort(function (a, b) {
      var sa = status(players[a] || { items: [] }); var sb = status(players[b] || { items: [] });
      var r = function (s) { return !s ? 3 : s.cls === 'live' ? 0 : s.cls === 'called' ? 1 : 2; };
      return r(sa) - r(sb) || a.localeCompare(b, 'de');
    }).forEach(function (n) {
      list.appendChild(playerCard(players[n] || { name: n, club: '', items: [], wins: 0, losses: 0 }));
    });
    var nb = document.getElementById('notifyBtn');
    nb.hidden = !names.length || !('Notification' in window) || Notification.permission !== 'default';
  }

  function renderSpieler(players) {
    var term = pq.value.trim().toLowerCase();
    var list = document.getElementById('spielerList');
    list.replaceChildren();
    var all = Object.keys(players).map(function (n) { return players[n]; })
      .filter(function (p) { return !term || (p.name + ' ' + p.club).toLowerCase().indexOf(term) >= 0; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    all.forEach(function (p) {
      var row = el('div', 'pl-row');
      row.appendChild(starBtn(Follow.has(p.name), Follow.has(p.name) ? 'Nicht mehr folgen' : 'Folgen', function () { Follow.toggle(p.name); }));
      var who = el('div', 'pl-who');
      who.appendChild(profileLink('b', p.name));
      if (p.club) who.appendChild(el('span', 'muted', p.club));
      row.appendChild(who);
      var st = status(p);
      if (st) row.appendChild(el('span', 'pl-status ' + st.cls, st.text));
      if (p.wins + p.losses) row.appendChild(el('span', 'pl-rec', p.wins + ':' + p.losses));
      list.appendChild(row);
    });
    if (!all.length) list.appendChild(el('p', 'muted', term ? 'Niemand gefunden.' : 'Noch keine Spieler bekannt.'));
  }

  function renderVereine(players) {
    var clubs = {};
    Object.keys(players).forEach(function (n) {
      var p = players[n];
      if (!p.club) return;
      var c = clubs[p.club] || (clubs[p.club] = { name: p.club, players: [], live: 0, wins: 0, losses: 0 });
      c.players.push(p);
      c.wins += p.wins;
      c.losses += p.losses;
      var st = status(p);
      if (st && st.cls === 'live') c.live++;
    });
    var list = document.getElementById('vereineList');
    list.replaceChildren();
    var names = Object.keys(clubs).sort(function (a, b) { return clubs[b].players.length - clubs[a].players.length || a.localeCompare(b, 'de'); });
    document.getElementById('vereineHint').hidden = names.length > 0;
    names.forEach(function (cn) {
      var c = clubs[cn];
      var box = el('details', 'pl-club');
      var sum = el('summary', 'pl-row');
      sum.appendChild(starBtn(Follow.hasClub(cn), Follow.hasClub(cn) ? 'Verein nicht mehr folgen' : 'Verein folgen', function (e) { e.preventDefault(); Follow.toggleClub(cn); }));
      var who = el('div', 'pl-who');
      who.appendChild(el('b', null, cn));
      who.appendChild(el('span', 'muted', c.players.length + ' Spieler · ' + c.wins + (c.wins === 1 ? ' Sieg' : ' Siege') +
        ' · ' + c.losses + (c.losses === 1 ? ' Niederlage' : ' Niederlagen')));
      sum.appendChild(who);
      if (c.live) sum.appendChild(el('span', 'pl-status live', c.live + (c.live === 1 ? ' spielt gerade' : ' spielen gerade')));
      box.appendChild(sum);
      c.players.sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); }).forEach(function (p) {
        var row = el('div', 'pl-row sub');
        row.appendChild(starBtn(Follow.has(p.name), 'Folgen', function () { Follow.toggle(p.name); }));
        var pw = el('span', 'pl-who');
        pw.appendChild(profileLink('span', p.name));
        row.appendChild(pw);
        var st = status(p);
        if (st) row.appendChild(el('span', 'pl-status ' + st.cls, st.text));
        if (p.wins + p.losses) row.appendChild(el('span', 'pl-rec', p.wins + ':' + p.losses));
        box.appendChild(row);
      });
      if (openClubs[cn]) box.open = true;
      box.addEventListener('toggle', function () { openClubs[cn] = box.open; });
      list.appendChild(box);
    });
  }
  var openClubs = {};

  // ---- Statistik aus allen beendeten Spielen
  // ---- Statistik: Kennzahlen und Tabellen aus den beendeten Spielen (die der Ticker kennt)
  var ROUND = /\s+(R\d+|VF|HF|Finale|\d+\/\d+|G\d+|Q\d*|Runde \d+)$/i;
  function eventOf(m) { return (m.name || 'Spiel').replace(ROUND, '') || m.name; }
  function isDoubles(m) { return m.doubles != null ? m.doubles : (m.home.length > 1 || m.away.length > 1); }
  function pts(m) { return m.sets.reduce(function (a, s) { return a + s.home + s.away; }, 0); }
  function desc(m) { return m.name + ': ' + m.home.filter(Boolean).join(' / ') + ' – ' + m.away.filter(Boolean).join(' / '); }
  function avg(list) { return list.length ? list.reduce(function (a, b) { return a + b; }, 0) / list.length : null; }
  function pct(a, b) { return b ? Math.round(a / b * 100) + ' %' : '–'; }
  function clubOf(m, side, i) { return ((side === 'home' ? m.homeClubs : m.awayClubs) || [])[i] || ''; }

  var statDay = '';   // gewählter Turniertag ('' = alle)
  function computeStats(state) {
    var done = ((state && state.matches) || []).filter(function (m) { return m.status === 'finished' && m.winner; });
    if (statDay) done = done.filter(function (m) { return BL.dayOf(m) === statDay; });
    var st = { done: done, players: {}, clubs: {}, events: {}, courts: {} };
    done.forEach(function (m) {
      // Disziplin
      var ev = eventOf(m);
      var e = st.events[ev] || (st.events[ev] = { name: ev, matches: 0, durations: [], points: [], three: 0 });
      e.matches++; e.points.push(pts(m));
      if (m.duration) e.durations.push(m.duration);
      if (m.sets.length >= 3) e.three++;
      // Court
      if (m.lastCourt) {
        var c = st.courts[m.lastCourt] || (st.courts[m.lastCourt] = { court: m.lastCourt, matches: 0, time: 0 });
        c.matches++; c.time += m.duration || 0;
      }
      // Spieler und Vereine
      ['home', 'away'].forEach(function (side) {
        var won = side === m.winner;
        var other = side === 'home' ? 'away' : 'home';
        var sw = 0, sl = 0, pw = 0, pl = 0;
        m.sets.forEach(function (s) {
          if (s[side] > s[other]) sw++; else if (s[other] > s[side]) sl++;
          pw += s[side]; pl += s[other];
        });
        var seen = {};
        (m[side] || []).forEach(function (n, i) {
          if (!n) return;
          var club = clubOf(m, side, i);
          var p = st.players[n] || (st.players[n] = { name: n, club: club, matches: 0, wins: 0, losses: 0, setsW: 0, setsL: 0, ptsW: 0, ptsL: 0, time: 0, events: {} });
          if (club && !p.club) p.club = club;
          p.matches++; p[won ? 'wins' : 'losses']++;
          p.setsW += sw; p.setsL += sl; p.ptsW += pw; p.ptsL += pl; p.time += m.duration || 0;
          p.events[eventOf(m)] = true;
          if (club && !seen[club]) {
            seen[club] = true;
            var k = st.clubs[club] || (st.clubs[club] = { name: club, players: {}, matches: 0, wins: 0, losses: 0 });
            k.matches++; k[won ? 'wins' : 'losses']++;
          }
          if (club) st.clubs[club].players[n] = true;
        });
      });
    });
    return st;
  }

  function table(title, head, rows) {
    var wrap = el('div', 'stat-table');
    wrap.appendChild(el('h3', null, title));
    var sc = el('div', 'table-scroll');
    var t = el('table', 'group-table');
    var tr = el('tr');
    head.forEach(function (h) { tr.appendChild(el('th', null, h)); });
    t.appendChild(tr);
    rows.forEach(function (r) {
      var row = el('tr');
      r.forEach(function (c, i) {
        var td = el('td');
        if (c && c.nodeType) td.appendChild(c); else td.textContent = c == null ? '–' : String(c);
        row.appendChild(td);
      });
      t.appendChild(row);
    });
    sc.appendChild(t);
    wrap.appendChild(sc);
    return wrap;
  }

  function renderStats(state) {
    // Turniertage zur Auswahl
    var days = [];
    ((state && state.matches) || []).forEach(function (m) {
      if (m.status !== 'finished' || !m.winner) return;
      var d = BL.dayOf(m);
      if (d && days.indexOf(d) < 0) days.push(d);
    });
    days.sort();
    if (statDay && days.indexOf(statDay) < 0) statDay = '';
    BL.dayPicker(document.getElementById('statDays'), days, statDay, function (d) { statDay = d; renderStats(last); });
    var st = computeStats(state);
    var done = st.done;
    var tiles = [];
    var withDur = done.filter(function (m) { return m.duration; });
    var total = withDur.reduce(function (a, m) { return a + m.duration; }, 0);
    var all = (state && state.matches) || [];
    tiles.push({ big: String(done.length), label: 'Spiele beendet',
      sub: all.filter(function (m) { return m.status === 'live'; }).length + ' laufen gerade' + ((state && state.upcoming) ? ' · ' + state.upcoming.length + ' angesetzt' : '') });
    tiles.push({ big: String(Object.keys(st.players).length), label: 'Spieler', sub: Object.keys(st.clubs).length ? Object.keys(st.clubs).length + ' Vereine' : null });
    if (withDur.length) {
      tiles.push({ big: Follow.duration(total), label: 'Spielzeit insgesamt', sub: 'auf allen Courts zusammen' });
      var s1 = withDur.filter(function (m) { return !isDoubles(m); }).map(function (m) { return m.duration; });
      var d1 = withDur.filter(isDoubles).map(function (m) { return m.duration; });
      var both = s1.length && d1.length;
      var durSplit = function (fn) { return both ? 'Einzel ' + Follow.duration(fn(s1)) + ' · Doppel ' + Follow.duration(fn(d1)) : null; };
      tiles.push({ big: Follow.duration(avg(withDur.map(function (m) { return m.duration; }))), label: 'Ø Spieldauer', split: durSplit(avg),
        sub: both ? null : (s1.length ? 'nur Einzel' : 'nur Doppel') });
      var longest = withDur.slice().sort(function (a, b) { return b.duration - a.duration; })[0];
      tiles.push({ big: Follow.duration(longest.duration), label: 'Längstes Spiel', sub: desc(longest),
        split: durSplit(function (l) { return Math.max.apply(null, l); }) });
      var shortest = withDur.slice().sort(function (a, b) { return a.duration - b.duration; })[0];
      tiles.push({ big: Follow.duration(shortest.duration), label: 'Kürzestes Spiel', sub: desc(shortest),
        split: durSplit(function (l) { return Math.min.apply(null, l); }) });
    }
    if (done.length) {
      // Einzel und Doppel getrennt (zweite Zeile der Kachel) – nur wenn es beides gibt
      var singles = done.filter(function (m) { return !isDoubles(m); });
      var doubles = done.filter(isDoubles);
      var split = function (fn) {
        if (!singles.length || !doubles.length) return null;
        return 'Einzel ' + fn(singles) + ' · Doppel ' + fn(doubles);
      };
      var avgPts = function (list) { return Math.round(avg(list.map(pts))); };
      var maxPts = function (list) { return Math.max.apply(null, list.map(pts)); };
      var threeOf = function (list) { return list.filter(function (m) { return m.sets.length >= 3; }).length; };
      // gedreht: Sieger hat den ersten Satz verloren
      var turned = function (list) {
        return list.filter(function (m) { var f = m.sets[0]; return f && (m.winner === 'home' ? f.away > f.home : f.home > f.away); }).length;
      };
      var setsOf = function (list) { var a = []; list.forEach(function (m) { m.sets.forEach(function (x) { a.push({ s: x, m: m }); }); }); return a; };
      var extOf = function (list) { return setsOf(list).filter(function (x) { return Math.max(x.s.home, x.s.away) > 21; }).length; };
      var longestSet = function (list) { return setsOf(list).sort(function (a, b) { return (b.s.home + b.s.away) - (a.s.home + a.s.away); })[0]; };
      var setText = function (x) { return x ? Math.max(x.s.home, x.s.away) + ':' + Math.min(x.s.home, x.s.away) : '–'; };

      tiles.push({ big: String(avgPts(done)), label: 'Ø Punkte je Spiel', sub: done.reduce(function (a, m) { return a + pts(m); }, 0) + ' Punkte insgesamt', split: split(avgPts) });
      var most = done.slice().sort(function (a, b) { return pts(b) - pts(a); })[0];
      tiles.push({ big: String(pts(most)), label: 'Meiste Punkte in einem Spiel', sub: desc(most), split: split(maxPts) });
      var three = threeOf(done);
      tiles.push({ big: pct(three, done.length), label: 'Spiele über drei Sätze', sub: three + ' von ' + done.length,
        split: split(function (l) { return pct(threeOf(l), l.length); }) });
      tiles.push({ big: String(turned(done)), label: 'Gedrehte Spiele', sub: 'Sieg nach verlorenem ersten Satz', split: split(turned) });
      tiles.push({ big: String(extOf(done)), label: 'Verlängerte Sätze', sub: 'über 21 Punkte (von ' + setsOf(done).length + ' Sätzen)', split: split(extOf) });
      var bestSet = longestSet(done);
      if (bestSet) tiles.push({ big: bestSet.s.home + ':' + bestSet.s.away, label: 'Längster Satz', sub: desc(bestSet.m),
        split: split(function (l) { return setText(longestSet(l)); }) });
    }
    var plist = Object.keys(st.players).map(function (n) { return st.players[n]; });
    var top = plist.filter(function (p) { return p.wins; }).sort(function (a, b) { return b.wins - a.wins || a.losses - b.losses; })[0];
    if (top) tiles.push({ big: String(top.wins), label: 'Meiste Siege', sub: top.name + (top.club ? ' · ' + top.club : '') });
    var busy = plist.slice().sort(function (a, b) { return b.time - a.time; })[0];
    if (busy && busy.time) tiles.push({ big: Follow.duration(busy.time), label: 'Längste Spielzeit', sub: busy.name + ' · ' + busy.matches + ' Spiele' });
    var clubs = Object.keys(st.clubs).map(function (k) { return st.clubs[k]; });
    var topClub = clubs.slice().sort(function (a, b) { return b.wins - a.wins; })[0];
    if (topClub && topClub.wins) tiles.push({ big: String(topClub.wins), label: 'Erfolgreichster Verein', sub: topClub.name });
    if (sched && sched.delay != null) tiles.push({ big: Schedule.deltaText(sched.delay), label: 'Zeitplan (geschätzt)', sub: Schedule.delayText(sched.delay) + ', aus den zuletzt aufgerufenen Spielen' });

    var box = document.getElementById('statTiles');
    box.replaceChildren();
    tiles.forEach(function (t) {
      var d = el('div', 'stat');
      d.appendChild(el('b', null, t.big));
      d.appendChild(el('span', 'stat-label', t.label));
      if (t.split) d.appendChild(el('span', 'stat-split', t.split));
      if (t.sub) d.appendChild(el('span', 'muted', t.sub));
      box.appendChild(d);
    });
    if (!done.length) box.appendChild(el('p', 'muted', 'Noch keine beendeten Spiele.'));
    document.getElementById('statExport').hidden = !done.length;

    // Tabellen
    var tb = document.getElementById('statTables');
    tb.replaceChildren();
    if (!done.length) return;
    var evs = Object.keys(st.events).map(function (k) { return st.events[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    tb.appendChild(table('Nach Disziplin', ['Disziplin', 'Spiele', 'Ø Dauer', 'Ø Punkte', '3 Sätze'], evs.map(function (e) {
      return [e.name, e.matches, e.durations.length ? Follow.duration(avg(e.durations)) : null, Math.round(avg(e.points)), pct(e.three, e.matches)];
    })));
    var ranked = plist.slice().sort(function (a, b) { return b.wins - a.wins || (b.setsW - b.setsL) - (a.setsW - a.setsL) || (b.ptsW - b.ptsL) - (a.ptsW - a.ptsL); });
    tb.appendChild(table('Spieler (Top 15 nach Siegen)', ['', 'Spieler', 'Verein', 'Spiele', 'Siege', 'Niederl.', 'Sätze', 'Punkte'], ranked.slice(0, 15).map(function (p, i) {
      return [i + 1, profileLink('span', p.name), p.club || '', p.matches, p.wins, p.losses, p.setsW + ':' + p.setsL, p.ptsW + ':' + p.ptsL];
    })));
    if (clubs.length) {
      tb.appendChild(table('Vereine', ['Verein', 'Spieler', 'Spiele', 'Siege', 'Niederl.', 'Siegquote'], clubs.sort(function (a, b) { return b.wins - a.wins || a.losses - b.losses; }).map(function (c) {
        return [c.name, Object.keys(c.players).length, c.matches, c.wins, c.losses, pct(c.wins, c.matches)];
      })));
    }
    var cts = Object.keys(st.courts).map(function (k) { return st.courts[k]; }).sort(function (a, b) { return String(a.court).localeCompare(String(b.court), 'de', { numeric: true }); });
    if (cts.length) {
      tb.appendChild(table('Courts', ['Court', 'Spiele', 'Spielzeit', 'Ø Dauer'], cts.map(function (c) {
        return ['Court ' + c.court, c.matches, c.time ? Follow.duration(c.time) : null, c.time ? Follow.duration(c.time / c.matches) : null];
      })));
    }
  }

  // ---- Statistik eines einzelnen Spielers
  function renderProfile(state) {
    var name = profileName;
    var box = document.getElementById('profil');
    box.replaceChildren();
    var all = (state && state.matches) || [];
    var mine = all.filter(function (m) { return (m.home || []).indexOf(name) >= 0 || (m.away || []).indexOf(name) >= 0; });
    var ups = ((state && state.upcoming) || []).filter(function (u) { return (u.home || []).indexOf(name) >= 0 || (u.away || []).indexOf(name) >= 0; });
    var sideOf = function (m) { return (m.home || []).indexOf(name) >= 0 ? 'home' : 'away'; };
    var other = function (sd) { return sd === 'home' ? 'away' : 'home'; };
    // Kopf
    var anyM = mine[0] || ups[0];
    var club = '', nat = '';
    if (anyM) {
      var sd0 = sideOf(anyM), i0 = anyM[sd0].indexOf(name);
      club = ((sd0 === 'home' ? anyM.homeClubs : anyM.awayClubs) || [])[i0] || '';
      nat = ((sd0 === 'home' ? anyM.homeNations : anyM.awayNations) || [])[i0] || '';
    }
    var head = el('div', 'pl-head pl-profile-head');
    head.appendChild(starBtn(Follow.has(name), Follow.has(name) ? 'Nicht mehr folgen' : 'Folgen', function () { Follow.toggle(name); }));
    var who = el('div', 'pl-who');
    var h = el('h2', 'pl-name');
    var f = nat && Nations.flag(nat);
    if (f) h.appendChild(f);
    h.appendChild(document.createTextNode(name));
    who.appendChild(h);
    if (club) who.appendChild(el('span', 'muted', club));
    head.appendChild(who);
    var live = mine.filter(function (m) { return m.status === 'live' || m.status === 'called'; })[0];
    if (live) head.appendChild(el('span', 'pl-status live', (live.status === 'live' ? 'Spielt auf Court ' : 'Aufruf Court ') + live.court));
    box.appendChild(head);
    if (!anyM) { box.appendChild(el('p', 'muted', 'Zu diesem Spieler gibt es noch keine Spiele.')); return; }

    // Kennzahlen aus den beendeten Spielen
    var done = mine.filter(function (m) { return m.status === 'finished' && m.winner; })
      .sort(function (a, b) { return (a.finishedAt || a.date || '').localeCompare(b.finishedAt || b.date || ''); });
    var st = { w: 0, l: 0, sw: 0, sl: 0, pw: 0, pl: 0, time: 0, timed: 0, three: 0, threeW: 0, turned: 0, ext: 0, extW: 0, longest: null };
    var partners = {}, opponents = {}, events = {};
    done.forEach(function (m) {
      var me = sideOf(m), op = other(me), won = m.winner === me;
      st[won ? 'w' : 'l']++;
      m.sets.forEach(function (x) {
        if (x[me] > x[op]) st.sw++; else if (x[op] > x[me]) st.sl++;
        st.pw += x[me]; st.pl += x[op];
        if (Math.max(x.home, x.away) > 21) { st.ext++; if (x[me] > x[op]) st.extW++; }
      });
      if (m.duration) { st.time += m.duration; st.timed++; if (!st.longest || m.duration > st.longest.duration) st.longest = m; }
      if (m.sets.length >= 3) { st.three++; if (won) st.threeW++; }
      var f1 = m.sets[0];
      if (won && f1 && f1[op] > f1[me]) st.turned++;
      var ev = eventOf(m);
      var e = events[ev] || (events[ev] = { name: ev, w: 0, l: 0 });
      e[won ? 'w' : 'l']++;
      m[me].forEach(function (n) { if (n && n !== name) { var p = partners[n] || (partners[n] = { name: n, w: 0, l: 0 }); p[won ? 'w' : 'l']++; } });
      var key = m[op].filter(Boolean).join(' / ');
      if (key) { var o = opponents[key] || (opponents[key] = { name: key, w: 0, l: 0 }); o[won ? 'w' : 'l']++; }
    });
    var tiles = [
      { big: st.w + ':' + st.l, label: 'Siege : Niederlagen', sub: done.length ? pct(st.w, done.length) + ' Siegquote' : 'noch kein Ergebnis' },
      { big: st.sw + ':' + st.sl, label: 'Sätze', sub: st.pw + ':' + st.pl + ' Punkte' },
    ];
    if (st.timed) tiles.push({ big: Follow.duration(st.time), label: 'Spielzeit', sub: 'Ø ' + Follow.duration(st.time / st.timed) + ' je Spiel' });
    if (st.longest) tiles.push({ big: Follow.duration(st.longest.duration), label: 'Längstes Spiel', sub: desc(st.longest) });
    if (done.length) {
      tiles.push({ big: String(st.three), label: 'Spiele über drei Sätze', sub: st.threeW + ' davon gewonnen' });
      tiles.push({ big: String(st.turned), label: 'Gedrehte Spiele', sub: 'Sieg nach verlorenem ersten Satz' });
      tiles.push({ big: String(st.ext), label: 'Verlängerte Sätze', sub: st.extW + ' davon gewonnen' });
    }
    var tb = el('div', 'stat-tiles');
    tiles.forEach(function (t) {
      var d = el('div', 'stat');
      d.appendChild(el('b', null, t.big));
      d.appendChild(el('span', 'stat-label', t.label));
      if (t.sub) d.appendChild(el('span', 'muted', t.sub));
      tb.appendChild(d);
    });
    box.appendChild(tb);

    // Nächste Spiele und laufendes Spiel
    var nxt = mine.filter(function (m) { return m.status === 'live' || m.status === 'called'; }).map(function (m) { return { m: m, side: sideOf(m) }; })
      .concat(ups.map(function (u) { return { u: u, side: sideOf(u) }; }));
    if (nxt.length) {
      box.appendChild(el('h3', 'pl-h3', 'Als Nächstes'));
      var nl = el('div', 'pl-card');
      nxt.forEach(function (x) { nl.appendChild(itemRow(x, name)); });
      box.appendChild(nl);
    }

    // Spielverlauf (neueste zuerst), Sätze aus Sicht des Spielers
    if (done.length) {
      box.appendChild(table('Spiele', ['', 'Spiel', 'Partner', 'Gegner', 'Sätze', 'Dauer'], done.slice().reverse().map(function (m) {
        var me = sideOf(m), op = other(me), won = m.winner === me;
        var res = el('span', 'badge ' + (won ? 'won' : 'lost'), won ? 'Sieg' : 'Niederlage');
        return [res, m.name + (m.lastCourt ? ' · Court ' + m.lastCourt : ''),
          m[me].filter(function (n) { return n && n !== name; }).join(' / ') || '–',
          m[op].filter(Boolean).join(' / '),
          m.sets.map(function (x) { return x[me] + ':' + x[op]; }).join('  '),
          m.duration ? Follow.duration(m.duration) : null];
      })));
      var evs = Object.keys(events).map(function (k) { return events[k]; });
      if (evs.length > 1) tb.parentNode.appendChild(table('Nach Disziplin', ['Disziplin', 'Siege', 'Niederlagen'], evs.map(function (e) { return [e.name, e.w, e.l]; })));
      var ps = Object.keys(partners).map(function (k) { return partners[k]; });
      if (ps.length) box.appendChild(table('Partner', ['Partner', 'Siege', 'Niederlagen'], ps.map(function (p) { return [profileLink('span', p.name), p.w, p.l]; })));
      var os = Object.keys(opponents).map(function (k) { return opponents[k]; });
      box.appendChild(table('Gegner', ['Gegner', 'Siege', 'Niederlagen'], os.map(function (o) { return [o.name, o.w, o.l]; })));
      var exp = el('div', 'stat-export');
      var bt = el('button', null, 'Spiele exportieren (CSV)');
      bt.type = 'button';
      bt.addEventListener('click', function () {
        download(fileBase() + '_' + name.replace(/[^\wäöüÄÖÜß.-]+/g, '_') + '.csv', 'text/csv;charset=utf-8', csv([['Spiel', 'Court', 'Ende', 'Ergebnis', 'Partner', 'Gegner', 'Sätze', 'Dauer (min)']]
          .concat(done.map(function (m) {
            var me = sideOf(m), op = other(me);
            return [m.name, m.lastCourt || '', m.finishedAt ? new Date(m.finishedAt).toLocaleString('de-DE') : (m.date || ''),
              m.winner === me ? 'Sieg' : 'Niederlage', m[me].filter(function (n) { return n && n !== name; }).join(' / '),
              m[op].filter(Boolean).join(' / '), m.sets.map(function (x) { return x[me] + ':' + x[op]; }).join(' '), minutes(m.duration)];
          }))));
      });
      exp.appendChild(bt);
      box.appendChild(exp);
    }
  }

  // ---- Export: CSV (Semikolon, UTF-8 mit BOM – öffnet sich direkt in Excel) und JSON
  function csv(rows) {
    return '﻿' + rows.map(function (r) {
      return r.map(function (c) {
        var v = c == null ? '' : String(c);
        return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(';');
    }).join('\r\n') + '\r\n';
  }
  function minutes(ms) { return ms ? Math.round(ms / 60000) : ''; }
  function download(name, type, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function fileBase() {
    var t = (last && last.tournament && last.tournament.name) || 'Turnier';
    return t.replace(/[^\wäöüÄÖÜß.-]+/g, '_').replace(/^_+|_+$/g, '') + '_' + (statDay || new Date().toISOString().slice(0, 10));
  }
  function exportData(kind) {
    var st = computeStats(last);
    var players = Object.keys(st.players).map(function (n) { return st.players[n]; });
    var clubs = Object.keys(st.clubs).map(function (k) { return st.clubs[k]; });
    var events = Object.keys(st.events).map(function (k) { return st.events[k]; });
    if (kind === 'print') return window.print();
    if (kind === 'matches') {
      return download(fileBase() + '_Spiele.csv', 'text/csv;charset=utf-8', csv([['Spiel', 'Disziplin', 'Court', 'Ende', 'Dauer (min)',
        'Heim', 'Verein Heim', 'Gast', 'Verein Gast', 'Sätze', 'Ergebnis', 'Sieger']].concat(st.done.map(function (m) {
        return [m.name, eventOf(m), m.lastCourt || '', m.finishedAt ? new Date(m.finishedAt).toLocaleString('de-DE') : '', minutes(m.duration),
          m.home.filter(Boolean).join(' / '), Follow.clubLine(m, 'home'), m.away.filter(Boolean).join(' / '), Follow.clubLine(m, 'away'),
          m.setsWon[0] + ':' + m.setsWon[1], m.sets.map(function (s) { return s.home + ':' + s.away; }).join(' '),
          (m.winner === 'home' ? m.home : m.away).filter(Boolean).join(' / ')];
      }))));
    }
    if (kind === 'players') {
      return download(fileBase() + '_Spieler.csv', 'text/csv;charset=utf-8', csv([['Spieler', 'Verein', 'Disziplinen', 'Spiele', 'Siege',
        'Niederlagen', 'Sätze gewonnen', 'Sätze verloren', 'Punkte gewonnen', 'Punkte verloren', 'Spielzeit (min)']].concat(players
        .sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); }).map(function (p) {
          return [p.name, p.club, Object.keys(p.events).join(', '), p.matches, p.wins, p.losses, p.setsW, p.setsL, p.ptsW, p.ptsL, minutes(p.time)];
        }))));
    }
    if (kind === 'clubs') {
      return download(fileBase() + '_Vereine.csv', 'text/csv;charset=utf-8', csv([['Verein', 'Spieler', 'Spiele', 'Siege', 'Niederlagen', 'Siegquote (%)']]
        .concat(clubs.sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); }).map(function (c) {
          return [c.name, Object.keys(c.players).length, c.matches, c.wins, c.losses, c.matches ? Math.round(c.wins / c.matches * 100) : ''];
        }))));
    }
    if (kind === 'events') {
      return download(fileBase() + '_Disziplinen.csv', 'text/csv;charset=utf-8', csv([['Disziplin', 'Spiele', 'Ø Dauer (min)', 'Ø Punkte', 'Spiele über 3 Sätze']]
        .concat(events.map(function (e) {
          return [e.name, e.matches, minutes(avg(e.durations)), Math.round(avg(e.points)), e.three];
        }))));
    }
    if (kind === 'json') {
      return download(fileBase() + '_Statistik.json', 'application/json', JSON.stringify({
        tournament: last && last.tournament && last.tournament.name,
        exportedAt: new Date().toISOString(),
        matches: st.done.map(function (m) {
          return { name: m.name, event: eventOf(m), court: m.lastCourt, finishedAt: m.finishedAt, durationMin: minutes(m.duration) || null,
            home: m.home, away: m.away, homeClubs: m.homeClubs, awayClubs: m.awayClubs, sets: m.sets, setsWon: m.setsWon, winner: m.winner };
        }),
        players: players.map(function (p) { return Object.assign({}, p, { events: Object.keys(p.events), timeMin: minutes(p.time) || 0, time: undefined }); }),
        clubs: clubs.map(function (c) { return Object.assign({}, c, { players: Object.keys(c.players) }); }),
        events: events.map(function (e) { return { name: e.name, matches: e.matches, avgDurationMin: minutes(avg(e.durations)) || null, avgPoints: Math.round(avg(e.points)), threeSets: e.three }; }),
      }, null, 2));
    }
  }
  document.querySelectorAll('[data-export]').forEach(function (b) {
    b.addEventListener('click', function () { if (last) exportData(b.dataset.export); });
  });

  function render(state) {
    last = state;
    sched = Schedule.compute(state);
    var note = document.getElementById('plSched');
    note.hidden = !Object.keys(sched.eta).length;
    note.textContent = (sched.delay != null ? 'Zeitplan: ' + Schedule.delayText(sched.delay) + '. ' : '') +
      'Zeiten mit „ca.“ sind unverbindliche Schätzungen aus dem bisherigen Turnierverlauf – ' +
      'maßgeblich ist allein der Aufruf durch die Turnierleitung.';
    var t = (state && state.tournament) || {};
    document.getElementById('tName').textContent = t.name ? t.name + ' – Spieler' : 'Spieler';
    var players = collect(state);
    renderMeine(players);
    if (tab === 'spieler') renderSpieler(players);
    if (tab === 'vereine') renderVereine(players);
    if (tab === 'statistik') renderStats(state);
    if (tab === 'profil') renderProfile(state);
    Follow.check(state);
    var c = document.getElementById('conn');
    c.textContent = state && state.bts && state.bts.connected ? 'Live verbunden' : 'Keine Verbindung zur Turniersoftware';
    c.className = 'conn ' + (state && state.bts && state.bts.connected ? 'ok' : 'warn');
  }

  var profileName = '';
  function showTab(t) {
    if (/^p=/.test(t)) {
      profileName = decodeURIComponent(t.slice(2));
      t = 'profil';
      window.scrollTo(0, 0);
    }
    if (['meine', 'spieler', 'vereine', 'statistik', 'profil'].indexOf(t) < 0) t = 'meine';
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    document.querySelectorAll('[data-panel]').forEach(function (s) { s.hidden = s.dataset.panel !== t; });
    if (last) render(last);
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { history.replaceState(null, '', '#' + b.dataset.tab); showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function () { showTab(location.hash.slice(1)); });
  pq.addEventListener('input', function () { if (last) render(last); });
  document.getElementById('notifyBtn').addEventListener('click', function () { Follow.askNotify(function () { if (last) render(last); }); });
  Follow.onChange(function () { if (last) render(last); });
  showTab(tab);
  BL.connect(render);
  setInterval(function () { if (last) render(last); }, 60000);
})();
</script>
</body>
</html>
